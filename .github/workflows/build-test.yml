name: AVR Firmware CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install AVR Toolchain (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-avr avr-libc cmake ninja-build

    - name: Install AVR Toolchain (macOS)
      if: runner.os == 'macOS'
      run: |
        brew tap osx-cross/avr
        brew trust osx-cross/avr
        brew install avr-gcc cmake ninja

    - name: Install AVR Toolchain (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install ninja
        Invoke-WebRequest -Uri "https://github.com/ZakKemble/avr-gcc-build/releases/download/v14.1.0-1/avr-gcc-14.1.0-x64-windows.zip" -OutFile "avr-gcc.zip"
        Expand-Archive -Path "avr-gcc.zip" -DestinationPath "C:\avr-gcc"
        $avrBin = (Get-ChildItem "C:\avr-gcc" -Filter "avr-gcc.exe" -Recurse | Select-Object -First 1).DirectoryName
        echo "$avrBin" >> $env:GITHUB_PATH

    - name: Configure CMake
      run: cmake -B build -G Ninja "-DCMAKE_TOOLCHAIN_FILE=cmake/avr-gcc.toolchain.cmake"

    - name: Build Project
      run: cmake --build build