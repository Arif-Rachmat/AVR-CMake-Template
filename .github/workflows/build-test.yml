name: AVR Firmware CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: windows-latest
            shell: msys2 {0}
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Toolchain (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-avr binutils-avr avr-libc avrdude cmake ninja-build make

    - name: Install Toolchain (macOS)
      if: runner.os == 'macOS'
      run: |
        brew tap osx-cross/avr
        brew trust osx-cross/avr
        brew install avr-gcc avrdude cmake ninja

    - name: Install Toolchain (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-avr-toolchain
          mingw-w64-ucrt-x86_64-avrdude
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-make

    - name: Configure CMake
      run: cmake -B build -G Ninja "-DCMAKE_TOOLCHAIN_FILE=cmake/avr-gcc.toolchain.cmake"

    - name: Build Project
      run: cmake --build build